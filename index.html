<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f9" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <title>Flick</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- 入力欄は JavaScript の読み込みを待たずに使える。中身は /boot.js が受け取る -->
    <header class="top">
      <form id="composer" class="composer glass" autocomplete="off">
        <textarea
          id="memo"
          rows="1"
          enterkeyhint="send"
          autofocus
          placeholder="メモ"
          aria-label="メモ"
          maxlength="2000"
        ></textarea>
        <button id="ai" class="icon-btn ai-btn" type="button" aria-label="AIで分ける" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.7 4.6 4.6 1.7-4.6 1.7L12 16.1l-1.7-4.6-4.6-1.7 4.6-1.7L12 3.5z"/><path d="M18.5 14.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1z"/></svg>
        </button>
        <button id="send" class="icon-btn send-btn" type="submit" aria-label="追加">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
        </button>
      </form>
      <div id="account-slot" class="account-slot"><span class="sk sk-avatar"></span></div>
    </header>

    <div id="root">
      <div class="skeleton" data-testid="skeleton" aria-busy="true" aria-label="読み込み中">
        <div class="sk sk-seg"></div>
        <div class="sk-group">
          <div class="sk sk-label"></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:72%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:54%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:83%"></span></div>
        </div>
        <div class="sk-group">
          <div class="sk sk-label"></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:61%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:46%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:68%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:57%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:74%"></span></div>
          <div class="sk-card glass"><span class="sk sk-dot"></span><span class="sk sk-line" style="width:50%"></span></div>
        </div>
      </div>
    </div>

    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
